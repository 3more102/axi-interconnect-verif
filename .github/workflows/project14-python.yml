name: Project 14 Verification

on:
  push:
    branches:
      - main
      - "project14-*"
    paths:
      - "project14_axi_ucie/**"
      - ".github/workflows/project14-python.yml"
  pull_request:
    paths:
      - "project14_axi_ucie/**"
      - ".github/workflows/project14-python.yml"

jobs:
  coverage-guide-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install "pytest>=8"

      - name: Run coverage-guidance tests
        run: |
          cd project14_axi_ucie/source
          python -m pytest -q tests/test_coverage_guide.py

  rtl-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Compile and run AXI/UCIe RTL smoke test
        run: |
          cd project14_axi_ucie/source
          bash scripts/run_rtl_smoke.sh
